<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIX</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
    }

    body {
        cursor: default;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import { TTFLoader } from "three/addons/loaders/TTFLoader.js";

import { TextGeometry } from "three/addons/geometries/TextGeometry.js";


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xffffff);


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
    32,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 0, 11);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0xffffff,
    3
);

scene.add(ambientLight);


const mainLight = new THREE.DirectionalLight(
    0xffffff,
    4
);

mainLight.position.set(
    -3,
    6,
    8
);

scene.add(mainLight);


const frontLight = new THREE.DirectionalLight(
    0xffffff,
    2
);

frontLight.position.set(
    4,
    1,
    6
);

scene.add(frontLight);


// ============================================================
// LOGO GROUP
// ============================================================

const logo = new THREE.Group();

scene.add(logo);


// ============================================================
// MOUSE
// ============================================================

const mouse = new THREE.Vector2(
    999,
    999
);

const raycaster = new THREE.Raycaster();

let hovered = null;


window.addEventListener(
    "pointermove",
    (event) => {

        mouse.x =
            (event.clientX / window.innerWidth) * 2 - 1;

        mouse.y =
            -(event.clientY / window.innerHeight) * 2 + 1;

    }
);


// ============================================================
// FREDOKA
// ============================================================

const fontLoader = new TTFLoader();

const fredokaURL =
    "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf";


fontLoader.load(

    fredokaURL,

    (fontData) => {

        const font = new THREE.FontLoader
            ? null
            : null;

    },

    undefined,

    (error) => {

        console.error(
            "Fredoka failed to load:",
            error
        );

    }

);

</script>

</body>
</html>
