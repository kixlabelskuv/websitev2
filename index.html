<script type="module">

import * as THREE from "three";
import { TTFLoader } from "three/addons/loaders/TTFLoader.js";
import { Font } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 0, 16);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);


/* ---------------- LIGHTING ---------------- */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0xffffff,
    3
);

scene.add(ambient);

const light = new THREE.DirectionalLight(
    0xffffff,
    4
);

light.position.set(-4, 6, 10);
scene.add(light);


/* ---------------- LOGO ---------------- */

const logo = new THREE.Group();
scene.add(logo);


/* ---------------- MOUSE ---------------- */

const mouse = new THREE.Vector2(999, 999);
const raycaster = new THREE.Raycaster();

let hovered = null;

window.addEventListener("pointermove", (event) => {

    mouse.x =
        (event.clientX / window.innerWidth) * 2 - 1;

    mouse.y =
        -(event.clientY / window.innerHeight) * 2 + 1;

});


/* ---------------- COLORS ---------------- */

const BLUE = 0x8ec5f2;
const GREEN = 0x49c96b;
const RED = 0xf04444;


/* ---------------- FONT ---------------- */

const fontLoader = new TTFLoader();

const fredokaURL =
    "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf";

fontLoader.load(
    fredokaURL,

    (fontData) => {

        const font = new Font(fontData);

        createLogo(font);

        animate();

    },

    undefined,

    (error) => {

        console.error(
            "Fredoka could not be loaded:",
            error
        );

    }
);


/* ---------------- CREATE LETTER ---------------- */

function createLetter(character, color, size) {

    const geometry = new TextGeometry(
        character,
        {
            font: currentFont,

            size: size,

            depth: 0.42,

            curveSegments: 24,

            bevelEnabled: true,

            bevelThickness: 0.13,

            bevelSize: 0.085,

            bevelSegments: 8
        }
    );


    geometry.computeBoundingBox();


    const box = geometry.boundingBox;

    const width =
        box.max.x - box.min.x;

    const height =
        box.max.y - box.min.y;


    /*
        Center the actual geometry.
    */

    geometry.center();


    const material =
        new THREE.MeshPhysicalMaterial({

            color: color,

            roughness: 0.2,

            metalness: 0,

            clearcoat: 0.75,

            clearcoatRoughness: 0.15
        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.userData.width = width;
    mesh.userData.height = height;

    mesh.userData.targetScale =
        new THREE.Vector3(1, 1, 1);


    mesh.userData.targetRotation =
        new THREE.Vector3(0, 0, 0);


    logo.add(mesh);

    return mesh;
}


let currentFont;


/* ---------------- CREATE LOGO ---------------- */

function createLogo(font) {

    currentFont = font;


    /*
        MUCH SMALLER THAN BEFORE.

        K = largest
        I = 80% of K
        X = 50% of K
    */

    const K = createLetter(
        "K",
        BLUE,
        3.8
    );

    const I = createLetter(
        "I",
        GREEN,
        3.05
    );

    const X = createLetter(
        "X",
        RED,
        1.9
    );


    /*
        Get actual rendered widths.
    */

    const kWidth = K.userData.width;
    const iWidth = I.userData.width;
    const xWidth = X.userData.width;


    /*
        NEGATIVE GAP = overlap.

        This is what makes them look
        like one tightly packed logo.
    */

    const overlap = 0.16;


    /*
        K
    */

    K.position.x = 0;


    /*
        I touches / slightly overlaps K
    */

    I.position.x =
        K.position.x
        + (kWidth / 2)
        + (iWidth / 2)
        - overlap;


    /*
        X touches / slightly overlaps I
    */

    X.position.x =
        I.position.x
        + (iWidth / 2)
        + (xWidth / 2)
        - overlap;


    /*
        Center the WHOLE logo.

        This prevents the K from sitting too far
        left and the X too far right.
    */

    const left =
        K.position.x - kWidth / 2;

    const right =
        X.position.x + xWidth / 2;

    const center =
        (left + right) / 2;


    K.position.x -= center;
    I.position.x -= center;
    X.position.x -= center;


    /*
        Vertically position them so the
        different-sized letters still feel
        like the same logo.
    */

    K.position.y = 0;

    I.position.y = -0.12;

    X.position.y = -0.30;


    /*
        VERY SLIGHT 3D angle.
    */

    logo.rotation.y = -0.035;


    /*
        Keep the whole logo compact.
    */

    logo.scale.set(
        0.92,
        0.92,
        0.92
    );
}


/* ---------------- HOVER ---------------- */

function updateHover() {

    raycaster.setFromCamera(
        mouse,
        camera
    );


    const hits =
        raycaster.intersectObjects(
            logo.children,
            false
        );


    hovered =
        hits.length
            ? hits[0].object
            : null;


    logo.children.forEach(
        (letter) => {

            if (letter === hovered) {

                /*
                    Individual letter
                    inflates slightly.
                */

                letter.userData.targetScale.set(
                    1.10,
                    1.10,
                    1.14
                );


                letter.userData.targetRotation.set(
                    0.02,
                    0.06,
                    -0.015
                );

            } else {

                letter.userData.targetScale.set(
                    1,
                    1,
                    1
                );


                letter.userData.targetRotation.set(
                    0,
                    0,
                    0
                );

            }

        }
    );
}


/* ---------------- ANIMATION ---------------- */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateHover();


    logo.children.forEach(
        (letter) => {

            letter.scale.lerp(
                letter.userData.targetScale,
                0.12
            );


            letter.rotation.x +=
                (
                    letter.userData.targetRotation.x
                    -
                    letter.rotation.x
                ) * 0.12;


            letter.rotation.y +=
                (
                    letter.userData.targetRotation.y
                    -
                    letter.rotation.y
                ) * 0.12;


            letter.rotation.z +=
                (
                    letter.userData.targetRotation.z
                    -
                    letter.rotation.z
                ) * 0.12;

        }
    );


    renderer.render(
        scene,
        camera
    );
}


/* ---------------- RESIZE ---------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
