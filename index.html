<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIX</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f1ea;
        font-family: Arial, sans-serif;
    }

    #scene {
        position: fixed;
        inset: 0;
    }

    .topbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 28px 38px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }

    .logo-small {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -1px;
    }

    .menu {
        display: flex;
        gap: 28px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .menu span {
        pointer-events: auto;
        cursor: pointer;
    }

    .bottom {
        position: fixed;
        bottom: 30px;
        left: 38px;
        right: 38px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        z-index: 10;
        pointer-events: none;
    }

    .description {
        max-width: 270px;
        font-size: 13px;
        line-height: 1.5;
        font-weight: 500;
    }

    .hint {
        font-size: 11px;
        letter-spacing: .12em;
        text-transform: uppercase;
        opacity: .55;
    }

    canvas {
        display: block;
    }
</style>
</head>

<body>

<div id="scene"></div>

<div class="topbar">
    <div class="logo-small">KIX®</div>

    <div class="menu">
        <span>About</span>
        <span>Works</span>
        <span>Contact</span>
    </div>
</div>

<div class="bottom">
    <div class="description">
        An experimental visual identity built around
        playful 3D typography and movement.
    </div>

    <div class="hint">
        Hover the letters
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";


// --------------------------------------------------
// BASIC THREE.JS SETUP
// --------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xf4f1ea);

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 0.2, 12);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document
    .getElementById("scene")
    .appendChild(renderer.domElement);


// --------------------------------------------------
// LIGHTING
// --------------------------------------------------

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x999999,
    2.4
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
    0xffffff,
    4
);

keyLight.position.set(-4, 7, 8);
keyLight.castShadow = true;

scene.add(keyLight);


const fillLight = new THREE.DirectionalLight(
    0xffffff,
    2
);

fillLight.position.set(5, 2, 5);

scene.add(fillLight);


// --------------------------------------------------
// GROUP
// --------------------------------------------------

const kixGroup = new THREE.Group();

scene.add(kixGroup);


// --------------------------------------------------
// MATERIAL
// --------------------------------------------------

const material = new THREE.MeshPhysicalMaterial({

    color: 0x111111,

    roughness: 0.22,

    metalness: 0.02,

    clearcoat: 0.8,

    clearcoatRoughness: 0.15
});


// --------------------------------------------------
// LOAD 3D FONT
// --------------------------------------------------

const loader = new FontLoader();

loader.load(

    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/fonts/helvetiker_bold.typeface.json",

    function(font) {

        const letters = ["K", "I", "X"];

        const spacing = 3.05;

        letters.forEach((letter, index) => {

            const geometry = new TextGeometry(letter, {

                font: font,

                size: 3.15,

                depth: 0.85,

                curveSegments: 32,

                bevelEnabled: true,

                bevelThickness: 0.18,

                bevelSize: 0.11,

                bevelSegments: 8
            });

            geometry.computeBoundingBox();

            geometry.center();

            const mesh = new THREE.Mesh(
                geometry,
                material.clone()
            );

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            mesh.position.x =
                (index - 1) * spacing;

            mesh.userData.originalScale =
                new THREE.Vector3(1, 1, 1);

            mesh.userData.targetScale =
                new THREE.Vector3(1, 1, 1);

            mesh.userData.originalRotation =
                new THREE.Euler(0, 0, 0);

            mesh.userData.targetRotation =
                new THREE.Euler(0, 0, 0);

            kixGroup.add(mesh);
        });

        // Slight overall tilt
        kixGroup.rotation.x = -0.08;
        kixGroup.rotation.y = 0.08;

        animate();
    }
);


// --------------------------------------------------
// MOUSE
// --------------------------------------------------

const mouse = new THREE.Vector2();

const raycaster = new THREE.Raycaster();

let hoveredLetter = null;

window.addEventListener("pointermove", (event) => {

    mouse.x =
        (event.clientX / window.innerWidth) * 2 - 1;

    mouse.y =
        -(event.clientY / window.innerHeight) * 2 + 1;
});


// --------------------------------------------------
// HOVER EFFECT
// --------------------------------------------------

function updateHover() {

    raycaster.setFromCamera(mouse, camera);

    const intersections =
        raycaster.intersectObjects(
            kixGroup.children,
            false
        );

    hoveredLetter =
        intersections.length > 0
            ? intersections[0].object
            : null;


    kixGroup.children.forEach(letter => {

        const isHovered =
            letter === hoveredLetter;

        if (isHovered) {

            /*
             * BALLOON / INFLATION EFFECT
             *
             * X/Y/Z all expand,
             * but Y expands slightly more,
             * making the letter feel squishy.
             */

            letter.userData.targetScale.set(
                1.18,
                1.25,
                1.18
            );

            letter.userData.targetRotation.set(
                0,
                0.08,
                -0.025
            );

        } else {

            letter.userData.targetScale.set(
                1,
                1,
                1
            );

            letter.userData.targetRotation.set(
                0,
                0,
                0
            );
        }
    });
}


// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    updateHover();

    const time = clock.getElapsedTime();


    kixGroup.children.forEach((letter, index) => {

        // Smooth scale interpolation
        letter.scale.lerp(
            letter.userData.targetScale,
            0.12
        );


        // Smooth rotation
        letter.rotation.x +=
            (
                letter.userData.targetRotation.x -
                letter.rotation.x
            ) * 0.12;

        letter.rotation.y +=
            (
                letter.userData.targetRotation.y -
                letter.rotation.y
            ) * 0.12;

        letter.rotation.z +=
            (
                letter.userData.targetRotation.z -
                letter.rotation.z
            ) * 0.12;


        // Tiny floating movement
        const float =
            Math.sin(
                time * 1.2 + index * 0.45
            ) * 0.035;

        letter.position.y =
            float;
    });


    // Very subtle group movement
    kixGroup.rotation.y =
        0.08 +
        Math.sin(time * 0.5) * 0.025;

    kixGroup.rotation.x =
        -0.08 +
        Math.sin(time * 0.7) * 0.012;


    renderer.render(
        scene,
        camera
    );
}


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
