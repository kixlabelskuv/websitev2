<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIX</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: white;
    }

    canvas {
        display: block;
    }
</style>
</head>

<body>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { TTFLoader } from "three/addons/loaders/TTFLoader.js";
import { Font } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xffffff);


// ======================================================
// CAMERA
// ======================================================

const camera = new THREE.PerspectiveCamera(
    32,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 0, 10);


// ======================================================
// RENDERER
// ======================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ======================================================
// LIGHTING
// ======================================================

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0xffffff,
    3
);

scene.add(ambient);


const light = new THREE.DirectionalLight(
    0xffffff,
    4
);

light.position.set(-4, 6, 8);

scene.add(light);


// ======================================================
// LOGO
// ======================================================

const logo = new THREE.Group();

scene.add(logo);


// ======================================================
// MOUSE
// ======================================================

const mouse = new THREE.Vector2(999, 999);

const raycaster = new THREE.Raycaster();

let hovered = null;


window.addEventListener("pointermove", (event) => {

    mouse.x =
        (event.clientX / window.innerWidth) * 2 - 1;

    mouse.y =
        -(event.clientY / window.innerHeight) * 2 + 1;

});


// ======================================================
// COLORS
// ======================================================

const BLUE = 0x8ec5f2;
const GREEN = 0x49c96b;
const RED = 0xf04444;


// ======================================================
// FREDOKA
// ======================================================

const fontLoader = new TTFLoader();

const fredokaURL =
    "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf";


fontLoader.load(

    fredokaURL,

    (fontData) => {

        const font = new Font(fontData);

        createLogo(font);

        animate();

    },

    undefined,

    (error) => {

        console.error(
            "Fredoka could not be loaded:",
            error
        );

    }
);


// ======================================================
// CREATE LETTER
// ======================================================

function createLetter(
    character,
    color,
    size,
    x,
    y,
    z
) {

    const geometry = new TextGeometry(
        character,
        {
            font: currentFont,

            size: size,

            depth: 0.48,

            curveSegments: 24,

            bevelEnabled: true,

            bevelThickness: 0.16,

            bevelSize: 0.10,

            bevelSegments: 8
        }
    );


    geometry.computeBoundingBox();

    geometry.center();


    const material =
        new THREE.MeshPhysicalMaterial({

            color: color,

            roughness: 0.22,

            metalness: 0,

            clearcoat: 0.7,

            clearcoatRoughness: 0.18
        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.userData.normalScale =
        new THREE.Vector3(1, 1, 1);

    mesh.userData.targetScale =
        new THREE.Vector3(1, 1, 1);

    mesh.userData.normalRotation =
        new THREE.Vector3(0, 0, 0);

    mesh.userData.targetRotation =
        new THREE.Vector3(0, 0, 0);


    logo.add(mesh);

    return mesh;
}


let currentFont;


// ======================================================
// BUILD KIX
// ======================================================

function createLogo(font) {

    currentFont = font;


    /*
        PROPORTIONS:

        K = 100%
        I = 80%
        X = 50%

        The positions are intentionally VERY close.
    */


    // BIG K
    const K = createLetter(
        "K",
        BLUE,
        5.2,
        -3.25,
        0,
        0
    );


    // MEDIUM I
    const I = createLetter(
        "I",
        GREEN,
        4.15,
        0.15,
        -0.20,
        0
    );


    // SMALL X
    const X = createLetter(
        "X",
        RED,
        2.65,
        1.95,
        -0.95,
        0
    );


    /*
        Make the whole logo extremely close-up.
    */

    logo.scale.set(
        1.18,
        1.18,
        1.18
    );


    /*
        Very slight 3D perspective.
    */

    logo.rotation.y = -0.035;

}


// ======================================================
// HOVER / INFLATION
// ======================================================

function updateHover() {

    raycaster.setFromCamera(
        mouse,
        camera
    );


    const hits =
        raycaster.intersectObjects(
            logo.children,
            false
        );


    hovered =
        hits.length
            ? hits[0].object
            : null;


    logo.children.forEach(
        (letter) => {

            if (letter === hovered) {

                /*
                    INFLATE

                    This expands the actual
                    3D mesh rather than showing
                    a hover label.
                */

                letter.userData.targetScale.set(
                    1.17,
                    1.17,
                    1.22
                );


                letter.userData.targetRotation.set(
                    0.025,
                    0.08,
                    -0.02
                );

            } else {

                letter.userData.targetScale.set(
                    1,
                    1,
                    1
                );


                letter.userData.targetRotation.set(
                    0,
                    0,
                    0
                );

            }

        }
    );
}


// ======================================================
// ANIMATION
// ======================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    updateHover();


    logo.children.forEach(
        (letter) => {

            /*
                Smooth inflatable movement
            */

            letter.scale.lerp(
                letter.userData.targetScale,
                0.13
            );


            letter.rotation.x +=
                (
                    letter.userData.targetRotation.x -
                    letter.rotation.x
                ) * 0.13;


            letter.rotation.y +=
                (
                    letter.userData.targetRotation.y -
                    letter.rotation.y
                ) * 0.13;


            letter.rotation.z +=
                (
                    letter.userData.targetRotation.z -
                    letter.rotation.z
                ) * 0.13;

        }
    );


    renderer.render(
        scene,
        camera
    );
}


// ======================================================
// RESPONSIVE
// ======================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
